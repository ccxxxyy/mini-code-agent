[project]
name = "mini-code-agent"
version = "1.0.0"
description = "A terminal-based coding agent tool inspired by Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "ccxxxyy"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"
mini = "mini_agent.cli:main"

[project.urls]
Homepage = "https://github.com/ccxxxyy/mini-code-agent"
Repository = "https://github.com/ccxxxyy/mini-code-agent"
Issues = "https://github.com/ccxxxyy/mini-code-agent/issues"
Changelog = "https://github.com/ccxxxyy/mini-code-agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["mini_agent"]
omit = [
    "*/ui/terminal.py",
    "*/ui/input_handler.py",
    "*/ui/esc_watcher.py",
    "*/ui/components.py",
    "*/mcp/client.py",
    "*/mcp/transport.py",
    "*/cli.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
