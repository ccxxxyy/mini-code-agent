[project]
name = "mini-code-agent"
version = "1.1.0"
description = "A terminal-based coding agent tool inspired by Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "ccxxxyy"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
remote = ["websockets>=12.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"
mini = "mini_agent.cli:main"

[project.urls]
Homepage = "https://github.com/ccxxxyy/mini-code-agent"
Repository = "https://github.com/ccxxxyy/mini-code-agent"
Issues = "https://github.com/ccxxxyy/mini-code-agent/issues"
Changelog = "https://github.com/ccxxxyy/mini-code-agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["mini_agent"]
omit = [
    "*/ui/terminal.py",
    "*/ui/input_handler.py",
    "*/ui/esc_watcher.py",
    "*/ui/components.py",
    "*/mcp/client.py",
    "*/mcp/transport.py",
    "*/cli.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["mini_agent"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

# Platform-divergent modules. An ignore that is REQUIRED on one platform reads as
# "unused" on the other, so warn_unused_ignores can never be satisfied on both:
#   - sandbox/windows.py, sandbox/_low_integrity.py: ctypes.windll / ctypes.WinError
#     do not exist in the Linux typeshed (errors on Linux, ignore unused on Windows)
#   - cli.py: sys.stdout.reconfigure needs a union-attr ignore on Windows, resolves
#     cleanly on Linux (ignore unused on Linux)
# Relaxed PER MODULE rather than globally, and NOT by re-excluding the files --
# excluding a whole directory is what previously hid 1,199 lines of remote/ from the
# type checker for months (tech-notes §134).
# 平台分歧模块。某平台上必需的 ignore 在另一平台上就是"未使用"，warn_unused_ignores
# 无法在两个平台同时满足。按模块放宽而非全局，也不用重新排除文件——整目录排除正是
# 此前让 remote/ 的 1,199 行长期脱离类型检查的原因（tech-notes §134）。
[[tool.mypy.overrides]]
module = [
    "mini_agent.cli",
    "mini_agent.security.sandbox.windows",
    "mini_agent.security.sandbox._low_integrity",
]
warn_unused_ignores = false

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
